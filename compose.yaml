services:
  app:
    build: .
    image: zoom-tg-bot:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BIND_HOST: 0.0.0.0
      DATABASE_URL: /app/data/bot_state.sqlite3
      GIT_NOTES_LOCAL_PATH: /app/meeting-notes
      NODE_ENV: production
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ${GIT_NOTES_LOCAL_PATH:-./data/meeting-notes}:/app/meeting-notes
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:${PORT:-8080}/healthz").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
